  R.innerHTML=`${t('latn')} <b>${fl(cp[1],2)}</b> · ${t('lonn')} <b>${fo(cp[0],2)}</b>`+(tab=='learn'?` <small>${(()=>{const q=provAt(cp[0],cp[1]);return q?q[L]:t('out')})()}</small>`:'')}
function xy(e){const r=$('map').getBoundingClientRect();return[(e.clientX-r.left)/r.width*766,(e.clientY-r.top)/r.height*480]}
const ll=([x,y])=>[LON0+x/K,LAT1-y/S];
$('map').addEventListener('pointermove',e=>{cp=ll(xy(e));drawDyn();ro()});
$('map').addEventListener('pointerleave',e=>{if(e.pointerType=='mouse'){cp=null;drawDyn();ro()}});
$('map').addEventListener('pointerdown',e=>{
  const p=xy(e);cp=ll(p);
  if(tab=='learn'){let b=-1,bd=18;C.forEach((c,i)=>{const d=Math.hypot(X(c.lo)-p[0],Y(c.la)-p[1]);if(d<bd){bd=d;b=i}});
    if(b>=0){sel=b;cp=[C[b].lo,C[b].la]}render()}
  else if(tab=='find'&&!done){
    const g=[cp[1],cp[0]],d=hv(T0[0],T0[1],g[0],g[1]),tol=[0,60,30,15][lv],ok=d<=tol;
    guesses.push(g);tries--;if(ok)sc+=tries+1;done=ok||tries==0;
    const dla=T0[0]-g[0],dlo=T0[1]-g[1],dirs=[];
    if(!ok){if(Math.abs(dla)>.15)dirs.push(dla>0?'dn':'ds');if(Math.abs(dlo)>.15)dirs.push(dlo>0?'de':'dw')}
    res={ok,d:Math.round(d),dirs};render()}
  drawDyn();ro()});
function newRound(){
  for(;;){let la=26.4+Math.random()*3.9,lo=80.2+Math.random()*7.9;
    if(lv==1){la=Math.round(la);lo=Math.round(lo)}else if(lv==2){la=+la.toFixed(1);lo=+lo.toFixed(1)}else{la=Math.round(la*60)/60;lo=Math.round(lo*60)/60}
    if(pip(lo,la)){T0=[la,lo];break}}
  tries=3;guesses=[];done=false;res=null}
function mkQuiz(){
  const qs=[{k:'c1',o:[0,1],a:0},{k:'c2',o:[0,1,2],a:1}],ids=()=>shuf(C.map((_,i)=>i));
  shuf(['at','at','north','east','lat','lat']).forEach(k=>{
    if(k=='at'){const o=ids().slice(0,4);qs.push({k,o,a:Math.floor(Math.random()*4)})}
    else if(k=='lat'){const c=Math.floor(Math.random()*C.length),r=Math.round(C[c].la),o=shuf([26,27,28,29,30].filter(v=>v!=r)).slice(0,3).concat(r);const so=shuf(o);qs.push({k,c,o:so,a:so.indexOf(r)})}
    else{let o;do{o=ids().slice(0,2)}while(Math.abs(C[o[0]][k=='north'?'la':'lo']-C[o[1]][k=='north'?'la':'lo'])<.4);
      const f=k=='north'?'la':'lo';qs.push({k,o,a:C[o[0]][f]>C[o[1]][f]?0:1})}});
  return{qs,i:0,s:0,p:null}}
const qText=q=>q.k=='at'?t('qat',{c:cs(C[q.o[q.a]].la,C[q.o[q.a]].lo,2)}):q.k=='lat'?t('qlat',{n:C[q.c][L]}):t(q.k);
const oText=(q,o)=>q.k=='c1'?t(o?'lonn':'latn'):q.k=='c2'?t('o'+o):q.k=='lat'?nd(o)+'°'+(isNe()?' उ.':'N'):C[o][L];
function render(){
  document.documentElement.lang=L;$('ttl').textContent=t('title');document.title=t('title');
  document.querySelectorAll('#lang button').forEach(b=>b.classList.toggle('on',b.dataset.l==L));
  document.querySelectorAll('#tabs button').forEach(b=>{b.textContent=t(b.dataset.t);b.classList.toggle('on',b.dataset.t==tab)});
  $('main').className=tab=='quiz'?'q':'';$('mw').hidden=tab=='quiz';
  const P=$('panel');let h='';
  if(tab=='learn'){
    h=`<h2>${t('lat_h')}</h2><p>${t('lat')}</p><h2>${t('lon_h')}</h2><p>${t('lon')}</p>
    <div class="info">${sel==null?t('tip'):`<b>${C[sel][L]}</b><br>${t('latn')}: ${fl(C[sel].la,2)} · ${t('lonn')}: ${fo(C[sel].lo,2)}`}</div>
    <div class="chips">${C.map((c,i)=>`<button class="chip ${sel==i?'on':''}" data-c="${i}">${c[L]}</button>`).join('')}</div><p>${t('ext')}</p>`}
  else if(tab=='find'){
    if(!T0)newRound();
    let m='';
    if(res){const dir=res.dirs.map(k=>t(k)).join(t('and'));m=res.ok?t('right',{d:nd(res.d)}):t('far',{d:nd(res.d)})+(dir?' '+t('go',{dir}):'')+(done?' '+t('reveal'):'')}
    h=`<div class="seg">${[1,2,3].map(n=>`<button data-lv="${n}" class="${lv==n?'on':''}">${t('lv'+n)}</button>`).join('')}</div>
    <p>${t('click')}</p><p class="big">${cs(T0[0],T0[1],lv)}</p><p aria-live="polite" style="min-height:3em">${m}</p>
    <p><b>${t('score')}: ${nd(sc)}</b> · ${t('tries',{n:nd(tries)})}</p>${done?`<button class="go" id="next">${t('next')}</button>`:''}`}
  else{
    if(!quiz)quiz=mkQuiz();
    const z=quiz,n=z.qs.length;
    if(z.i>=n)h=`<p class="big">${t('res',{s:nd(z.s),n:nd(n)})}</p><button class="go" id="again">${t('again')}</button>`;
    else{const q=z.qs[z.i];
      h=`<p><small>${t('qn',{i:nd(z.i+1),n:nd(n)})}</small></p><p class="big" style="font-size:clamp(20px,3.6vw,26px)">${qText(q)}</p>`+
      q.o.map((o,j)=>`<button class="opt ${z.p!=null?(j==q.a?'ok':j==z.p?'bad':''):''}" data-o="${j}" ${z.p!=null?'disabled':''}>${oText(q,o)}</button>`).join('')+
      (z.p!=null?`<p><b>${z.p==q.a?t('ok'):t('no')}</b></p><button class="go" id="qnext">${t('next')}</button>`:'')}}
  P.innerHTML=h;drawDyn();ro()}
$('lang').onclick=e=>{const l=e.target.dataset.l;if(l){L=l;drawBase();render()}};
$('tabs').onclick=e=>{const k=e.target.dataset.t;if(k){tab=k;cp=null;render()}};
$('panel').onclick=e=>{
  const d=e.target.dataset,id=e.target.id;
  if(d.c!=null){sel=+d.c;cp=[C[sel].lo,C[sel].la];render()}
  else if(d.lv){lv=+d.lv;sc=0;newRound();render()}
  else if(id=='next'){newRound();render()}
  else if(d.o!=null&&quiz.p==null){quiz.p=+d.o;if(quiz.p==quiz.qs[quiz.i].a)quiz.s++;render()}
  else if(id=='qnext'){quiz.i++;quiz.p=null;render()}
  else if(id=='again'){quiz=mkQuiz();render()}};
drawBase();render();
</script>
</body>
